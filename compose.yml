services:
  cedrikbot:
    build: .
    image: cedrikbot:local
    container_name: cedrikbot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
    networks: [db]
    healthcheck:
      # health.js écrit /tmp/health toutes les 30 s tant que les shards Discord sont connectés
      test: ["CMD", "node", "-e", "process.exit(Date.now() - require('fs').statSync('/tmp/health').mtimeMs < 90000 ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  db:
    external: true
